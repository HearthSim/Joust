name: CI

on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [lint:prettier, typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 500 # Needed for env:set-release
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.script }}
        run: pnpm run ${{ matrix.script }}

  release:
    name: Release
    needs: [test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/main')
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  deploy:
    name: Deploy
    needs: [release]
    runs-on: ubuntu-latest
    if: needs.release.outputs.version != ''
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 500 # Needed for env:set-release
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: |
          pnpm build
          if [ ! -f dist/joust.js ]; then >&2 echo "Missing critical file"; exit 1; fi
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload to static.hsreplay.net
        run: |
          aws s3 sync --delete dist/ s3://static.hsreplay.net/joust/ --cache-control "public, max-age=60, stale-while-revalidate=3600, stale-if-error=86400"
